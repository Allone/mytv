name: mytv
description: 全平台 MyTV，借鉴 mytv-android 的 IPTV 播放体验
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  media_kit_libs_video: ^1.0.4

  http: ^1.2.2
  dio: ^5.7.0
  xml: ^6.5.0

  provider: ^6.1.2
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5

  cached_network_image: ^3.4.1
  file_picker: ^8.1.4
  url_launcher: ^6.3.1
  wakelock_plus: ^1.2.8
  window_manager: ^0.4.3
  qr_flutter: ^4.1.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  archive: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/icon/icon.png
    background_color: "#FFFFFF"
    theme_color: "#FF8A00"
  windows:
    generate: true
    image_path: assets/icon/icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/icon/icon.png

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Subset.otf